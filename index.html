<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上達ノート</title>
<meta name="description" content="イラストの記録・自己評価・課題・制作スケジュールをまとめる上達ノート">
<meta name="theme-color" content="#EFEFEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1E1E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上達ノート">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: スケッチブックの見開き。左に「いまの課題」、右に「制作中スケジュール」、下に作品タイル。 */
:root{
  /* 面と文字は無彩色（色みゼロのグレー）。作品の色の見え方に影響しないように。色はボタンと評価の青だけに絞る */
  --paper:#EFEFEF; --sheet:#FFFFFF; --ink:#1A1A1A; --ink-2:#666666; --rule:#D6D6D6;
  --accent:#3F51C4; --accent-soft:#E6E6E6; --on-accent:#FFFFFF;
  --ph-rough:#9AA0AE; --ph-line:#2C3142; --ph-color:#D9774A; --ph-finish:#3AA38A; --ph-other:#8E6CC8;
  --warn:#C2410C; --warn-soft:#FDEBDD; --ok:#1F8A5B; --ok-soft:#DDF3E8;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E1E1E; --sheet:#282828; --ink:#ECECEC; --ink-2:#A0A0A0; --rule:#3C3C3C;
  --accent:#8F9DF5; --accent-soft:#363636; --on-accent:#121212;
  --ph-rough:#7D8494; --ph-line:#C9CEDB; --ph-color:#E8936A; --ph-finish:#5CC4A8; --ph-other:#B497EA;
  --warn:#FB9A64; --warn-soft:#3A2418; --ok:#5CD39A; --ok-soft:#17332A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E1E1E; --sheet:#282828; --ink:#ECECEC; --ink-2:#A0A0A0; --rule:#3C3C3C;
  --accent:#8F9DF5; --accent-soft:#363636; --on-accent:#121212;
  --ph-rough:#7D8494; --ph-line:#C9CEDB; --ph-color:#E8936A; --ph-finish:#5CC4A8; --ph-other:#B497EA;
  --warn:#FB9A64; --warn-soft:#3A2418; --ok:#5CD39A; --ok-soft:#17332A; color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
html{background:var(--paper)}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:500}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"brand actions icons";align-items:center;gap:12px 16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
header.top .brand{grid-area:brand} header.top .actions{grid-area:actions} header.top .top-icons{grid-area:icons;display:flex;gap:2px}
@media (max-width:720px){header.top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand icons" "actions actions"}
  .brand span{display:none} .brand h1{font-size:26px} header.top .actions .btn{flex:1}}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.02em}
.brand span{font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.sm{padding:4px 12px;font-size:13px}

.status-line{font-size:12px;color:var(--ink-2)}
.status-line b{font-weight:500;color:var(--ink)}

.spread{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.spread{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:17px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}

.challenge-text{font-size:21px;font-weight:700;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.plain{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.practice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px dashed var(--rule)}
.practice:first-child{border-top:none;padding-top:0}
.practice .t{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:3px;min-width:48px}
.practice b{font-weight:700}
.practice p{margin:0;grid-column:2;color:var(--ink-2);font-size:14px}
.ai-box{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:14px;white-space:pre-wrap;background:var(--paper)}
.empty{border:1.5px dashed var(--rule);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}

/* schedule */
.sched{display:flex;flex-direction:column;gap:18px}
.sched-item{display:flex;flex-direction:column;gap:8px}
.sched-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sched-head b{font-size:16px}
.bar{position:relative;height:30px;display:flex;border-radius:6px;overflow:hidden;background:var(--paper)}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;border-right:2px solid var(--sheet);opacity:.45}
.seg.done{opacity:1}
.seg.cur{opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}
.today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.today::after{content:"今日";position:absolute;top:-16px;left:-10px;font-size:10px;color:var(--warn);font-weight:700}
.sched-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}

/* gallery */
.gal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.gal-head h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{position:relative;border:none;padding:0;background:var(--sheet);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--rule)}
.tile:hover{box-shadow:0 0 0 2px var(--accent)}
.tile .img{aspect-ratio:1/1;width:100%;max-width:100%;background:var(--paper);display:block;object-fit:cover}
.tile .ph{aspect-ratio:1/1;width:100%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:28px;color:var(--ink-2);background:repeating-linear-gradient(135deg,var(--paper) 0 10px,var(--sheet) 10px 20px)}
.tile .cap{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .cap b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cap span{font-size:12px;color:var(--ink-2)}
.tile .badge{position:absolute;top:8px;left:8px}
.tile .score{position:absolute;top:8px;right:8px;background:var(--sheet);border-radius:999px;padding:1px 8px;font-size:12px;font-family:var(--f-mono)}

/* dialog */
dialog{border:none;border-radius:14px;padding:0;background:var(--sheet);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--rule)}
.dlg-head h3{font-size:18px}
.dlg-body{padding:20px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:22px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog{overscroll-behavior:contain}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt b{display:block}
.opt .chip{margin-left:6px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.note{font-size:13px;border-left:3px solid var(--rule);padding:4px 10px;color:var(--ink-2)}
.gacha{border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.gacha-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.gacha-slots{grid-template-columns:minmax(0,1fr)}}
.gslot{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--sheet);min-width:0}
.gslot b{font-size:18px;line-height:1.4;overflow-wrap:anywhere}
.gslot.locked{border-color:var(--accent)}
.gbtns{display:flex;gap:2px;flex-wrap:wrap;margin-left:-8px}
.gbtns [aria-pressed="true"]{color:var(--accent)}
.gextra{display:flex;flex-direction:column;gap:6px}
.gactions{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.datefield{position:relative;display:block;min-width:0}
.datefield input[type=date]{color:transparent;cursor:pointer}
.datefield input[type=date]::-webkit-datetime-edit{opacity:0}
.datefield .date-label{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;max-width:calc(100% - 44px)}
.datefield .date-label.empty{color:var(--ink-2)}
.suggest-box{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.suggest-box .vals{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.suggest-box .vals b{font-family:var(--f-mono);font-weight:500}
.suggest-box .diff{font-size:12px;color:var(--ink-2)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--rule);flex-wrap:wrap}
fieldset{border:none;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:12px}
legend{font-weight:700;font-size:15px;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
legend .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-weight:400}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:13px;color:var(--ink-2)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper)}
textarea{min-height:76px;resize:vertical}
.drop{border:1.5px dashed var(--rule);border-radius:10px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{max-height:140px;max-width:100%;border-radius:6px}
.stars{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr);gap:6px 12px;align-items:center}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{width:34px;height:30px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:pointer;font-family:var(--f-mono)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prev-box{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.phase-table{width:100%;border-collapse:collapse;font-size:14px}
.phase-table th,.phase-table td{padding:6px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.phase-table th{font-size:12px;color:var(--ink-2);font-weight:500}
.phase-table input[type=number]{width:64px;border:1px solid var(--rule);border-radius:6px;padding:4px 6px;background:var(--paper)}
.phase-table input[type=date]{padding:4px 6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tbl-wrap{overflow-x:auto}
@media (max-width:480px){.phase-table th,.phase-table td{padding:6px 3px}.phase-table input[type=text]{width:70px!important}.phase-table input[type=number]{width:50px}.phase-table .dot{display:none}.phase-table td.mono{font-size:12px}}
.detail-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:640px){.detail-top{grid-template-columns:minmax(0,1fr)}}
.detail-top img{width:100%;border-radius:8px;background:var(--paper)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv p{margin:0;white-space:pre-wrap}
.radar text{font-size:11px;fill:var(--ink-2);font-family:var(--f-body)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-size:14px;z-index:50}
.check{display:flex;align-items:center;gap:6px;cursor:pointer}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;font-size:13px;line-height:1.4}
.sugg button:hover{background:var(--accent-soft)}
.sugg small{display:block;color:var(--ink-2)}
.set-list{display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
.set-row.ph{grid-template-columns:minmax(0,1fr) 90px auto}
.set-row .ctl{display:flex;gap:2px}
.set-row input,.set-row select{padding:6px 8px}
.toggle{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.toggle input{margin-top:5px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:38px;height:32px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:var(--paper)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.days label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-top:-12px}
.tabs a{padding:8px 16px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-left:6px}
.view{display:flex;flex-direction:column;gap:28px}
/* drag handle */
.set-row{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto}
.set-row.ph{grid-template-columns:minmax(0,1fr) 90px auto}
.handle{width:30px;height:34px;border:none;background:transparent;color:var(--ink-2);cursor:grab;touch-action:none;border-radius:6px;font-size:16px;line-height:1}
.handle:hover{background:var(--accent-soft);color:var(--ink)}
.set-row.dragging{opacity:.9;background:var(--accent-soft);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.set-row.dragging .handle{cursor:grabbing}
.set-list.sorting .set-row{grid-template-columns:auto minmax(0,1fr);border:1px solid var(--rule);border-radius:8px;padding:4px 12px 4px 4px;background:var(--paper);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.set-list.sorting .set-row.dragging{cursor:grabbing;border-color:var(--accent)}
.set-list.sorting .set-row b{font-weight:500}
.toast{display:flex;align-items:center;gap:12px}
.discard{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.discard-btns{display:flex;gap:8px;margin-left:auto}
.toast button{border:none;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.sched-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--paper)}
.tag-input input{border:none!important;background:transparent!important;padding:2px 4px!important;flex:1;min-width:120px;width:auto!important}
.tag-input input:focus{outline:none}
.tag-input:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.tag-input .tag{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-size:13px}
.tag-input .tag button{border:none;background:none;color:inherit;cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.tile .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;overflow:hidden;max-height:26px;padding-bottom:2px}
.tile .tags .tag{line-height:1.6}
/* filters */
.filters{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.filter-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.filter-row .f{flex:1 1 150px}
.filter-row .f.narrow{flex:0 1 150px}
.tag-filter{display:flex;flex-wrap:wrap;gap:6px}
.tag-filter button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.tag-filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag-filter button .mono{font-size:11px;opacity:.75;margin-left:4px}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:40px}
.gbar-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;font-size:13px;color:var(--ink-2)}
.gbar-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon{position:relative;width:36px;height:36px;border:none;border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon:hover,.icon[aria-expanded="true"],.icon[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.icon .badge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10px;line-height:15px;text-align:center;font-family:var(--f-mono);padding:0 3px}
.search{display:flex;align-items:center}
.search input{width:170px;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:var(--sheet);font-size:14px}
@media (max-width:480px){.search input{width:120px}}
.fchip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:1px 4px 1px 10px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.fchip button{border:none;background:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:999px}
.fchip button:hover{background:var(--sheet)}
.linkbtn{border:none;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:12px;padding:2px 4px}
/* masonry */
/* ギャラリー：同じ大きさの正方形タイル（画像は中央を切り取って表示。全体は詳細画面で見る） */
.masonry{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,180px),1fr));gap:6px}
.masonry.big{--tile:320px}
@media (max-width:480px){.masonry{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.masonry.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
.masonry .tile{border-radius:4px;box-shadow:none;background:var(--rule);aspect-ratio:1/1;overflow:hidden}
.masonry .tile img{display:block;width:100%;height:100%;max-width:100%;object-fit:cover}
.masonry .tile:hover img{filter:brightness(1.06)}
.masonry .tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.masonry .ph{aspect-ratio:1/1}
@media (prefers-reduced-motion:no-preference){.masonry .tile img{transition:filter .2s}}
/* detail */
.d-nav{display:flex;gap:4px;align-items:center}
.d-score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.d-score .st{font-size:22px;letter-spacing:2px;color:var(--accent)}
.d-score .st .off{color:var(--rule)}
.d-score b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.d-rows{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;align-items:center}
.d-rows .st{color:var(--accent);letter-spacing:1px}
.d-rows .st .off{color:var(--rule)}
.detail-top img{max-height:70vh;object-fit:contain}
/* growth */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--rule);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:24px;font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .d{font-size:12px;color:var(--ink-2)}
.growth-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.growth-grid{grid-template-columns:minmax(0,1fr)}}
.chart-wrap{position:relative}
.chart text{font-size:11px;fill:var(--ink-2);font-family:var(--f-mono)}
.chart .grid line{stroke:var(--rule);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:2}
.ach{display:flex;flex-direction:column;gap:10px}
.ach-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.ach-row .c{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach-row .m{display:flex;gap:3px}
.ach-row .m i{width:12px;height:12px;border-radius:3px;background:var(--rule)}
.ach-row .m i.on{background:var(--accent)}
.ach-row .w{font-size:12px;color:var(--ink-2);grid-column:1/-1}
details summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.data-table{border-collapse:collapse;font-size:13px;margin-top:8px}
.data-table th,.data-table td{border-bottom:1px solid var(--rule);padding:4px 10px;text-align:left;white-space:nowrap}
.data-table td.n{font-family:var(--f-mono);text-align:right}
@media (prefers-reduced-motion:no-preference){.tile{transition:box-shadow .15s}}
</style>
</head>

      <button class="icon" id="btnSet" type="button" aria-label="設定"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

  <nav class="tabs" aria-label="表示の切り替え">

  <div class="view" id="viewHome">

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="gbar">
      <div class="gbar-l" aria-live="polite"><span id="fResult" class="mono"></span><span id="fChips" style="display:contents"></span></div>
      <div class="gbar-r">
        <div class="search"><input type="search" id="fq" placeholder="タイトル・タグ・メモ" aria-label="作品を検索" hidden>
          <button class="icon" type="button" id="btnSearch" aria-label="検索" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div>
        <button class="icon" type="button" id="btnFilter" aria-label="絞り込み・並び順" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="badge" id="fBadge" hidden></span></button>
        <button class="icon" type="button" id="btnSize" aria-label="作品を大きく表示" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
      </div>

      <div class="filter-row">
        <div class="f narrow"><label for="fPreset">期間</label><select id="fPreset">
          <option value="all">すべて</option><option value="m1">今月</option><option value="m3">過去3か月</option><option value="m6">過去6か月</option><option value="y0">今年</option><option value="y1">昨年</option><option value="custom">日付を指定</option></select></div>
        <div class="f narrow"><label for="fFrom">開始</label><input type="date" id="fFrom"></div>

          <option value="new">新しい順</option><option value="old">古い順</option><option value="score">自己評価が高い順</option></select></div>
      </div>
      <div class="f">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="label">タグ</span>
          <select id="fMode" aria-label="タグの条件" style="width:auto;padding:3px 8px;font-size:13px"><option value="any">いずれかを含む</option><option value="all">すべてを含む</option></select></div>

<script>
/* ============ 定数 ============ */
const APP_VERSION="2026.11.03-8";
const DEFAULT_SETTINGS={
  axes:[{key:"comp",label:"構図",cat:"composition"},{key:"form",label:"デッサン",cat:"anatomy"},{key:"line",label:"線画",cat:"lineart"},
        {key:"color",label:"色彩",cat:"color"},{key:"light",label:"光と影",cat:"light"},{key:"finish",label:"完成度",cat:"speed"}],
  suggest:true,
  useClaude:false,
  hours:{weekday:2,holiday:5},
  holidays:[0,6],
  phases:[{name:"ラフ",w:20},{name:"線画",w:30},{name:"着色",w:35},{name:"仕上げ",w:15}]
};
const WEEK=["日","月","火","水","木","金","土"];
const clone=o=>JSON.parse(JSON.stringify(o));
const PHASE_COLORS={"ラフ":"--ph-rough","線画":"--ph-line","着色":"--ph-color","仕上げ":"--ph-finish"};

/* 課題カテゴリごとの練習メニュー。time は1回あたりの目安。 */
const ADVICE={
  anatomy:{label:"人体・デッサン",hint:"体のバランスや立体感が不安定",practices:[
    ["15分","ジェスチャードローイング","写真資料を30秒〜2分で描き、ポーズの流れ（背骨の線）だけを捉える。細部は描かない。"],
    ["20分","箱と円柱で人体を組む","胸郭・骨盤を箱、手足を円柱に置き換えて、いろいろな角度から描く。"],
    ["30分","骨格・筋肉の模写","1回1部位（肩、膝など）に絞り、解剖図を見ながら模写して名前を書き込む。"]]},
  face:{label:"顔・表情",hint:"顔の角度や表情が固い",practices:[
    ["15分","アタリの回転練習","球と十字線で、正面→斜め→横→あおり→ふかんを1セットで描く。"],
    ["20分","表情の描き分け","同じキャラで喜怒哀楽＋2種を並べ、眉・まぶた・口角の違いを比べる。"],
    ["20分","好きな絵師の顔模写","目・鼻・口の位置関係を測りながら模写し、自分の絵と重ねて差を見る。"]]},
  hands:{label:"手・足",hint:"手や足を隠しがち・描くと崩れる",practices:[
    ["10分","自分の手のクロッキー","スマホで手を撮り、1枚2分で10枚描く。指の付け根の弧を意識。"],
    ["20分","ミトン→指の分解","手のひらをミトン形、指を3つの節に分けて描く。"],
    ["15分","持ち物を持たせる","ペン・コップ・スマホなど、物を持つ手を描いて接地面を意識する。"]]},
  pose:{label:"ポーズ・動き",hint:"立ち絵ばかり・動きが硬い",practices:[
    ["15分","ライン・オブ・アクション","1本の曲線を先に引き、それに沿って体を乗せる。1日10ポーズ。"],
    ["20分","スポーツ写真の模写","重心と支点（どこに体重が乗っているか）を赤で書き込む。"],
    ["30分","同じキャラで3ポーズ","立ち・座り・走りを描き、シルエットだけで判別できるかチェック。"]]},
  composition:{label:"構図",hint:"画面がいつも同じ・視線が散る",practices:[
    ["10分","サムネイル10枚","5cm角の枠で、白黒3値だけのサムネを10案出してから1枚を選ぶ。"],
    ["15分","名作の構図分析","好きなイラストの上に主線・三分割線・視線誘導を描き込む。"],
    ["20分","トリミング違い","同じ下描きを寄り・引き・斜めの3通りで切り取り比較する。"]]},
  perspective:{label:"パース・背景",hint:"背景が苦手・キャラが浮く",practices:[
    ["15分","箱の一点・二点透視","消失点を置いて箱を20個。地面に置く・浮かせる両方。"],
    ["20分","アイレベルに人を立たせる","水平線を引き、複数の人物の頭の高さを揃えて配置する。"],
    ["30分","部屋の写真模写","写真から消失点を見つけ、パース線を引いてから描く。"]]},
  lineart:{label:"線画",hint:"線がガタつく・強弱がない",practices:[
    ["10分","ストローク練習","直線・円・S字を各20本。肘から引く。毎回ウォームアップに。"],
    ["20分","強弱の付け方","輪郭は太く、内側・遠いものは細く。同じラフを2通りの線で清書し比べる。"],
    ["20分","ペン設定の見直し","手ぶれ補正・入り抜きを3段階で試し、自分に合う設定をメモする。"]]},
  color:{label:"色彩・配色",hint:"色が濁る・まとまらない",practices:[
    ["15分","3色配色サムネ","メイン・サブ・アクセントの3色だけでサムネを5案作る。"],
    ["20分","カラーピック分析","好きな絵からスポイトで5色抜き、彩度と明度の分布を並べてみる。"],
    ["15分","グレースケール確認","着色後に白黒表示にして、明暗差が足りているかチェックする。"]]},
  light:{label:"光と影",hint:"のっぺりする・立体感がない",practices:[
    ["15分","球・立方体のライティング","光源を1つ決め、ハイライト・明部・暗部・反射光・接地影を塗り分ける。"],
    ["20分","2値影の練習","キャラに影を1段階だけ入れ、形が伝わるかを見る。"],
    ["30分","光源違いの塗り比べ","同じ線画を順光・逆光・上から光で塗り分ける。"]]},
  painting:{label:"塗り・質感",hint:"塗り方が決まらない・質感が出ない",practices:[
    ["20分","素材の描き分け","金属・布・肌・髪を小さく並べて塗り、反射の強さの違いを見る。"],
    ["30分","好きな絵の塗り模写","レイヤー順（下塗り→影→光）を推測してメモしながら模写する。"],
    ["15分","ブラシを3本に絞る","使うブラシを3本だけにして1枚塗り、手順を固定化する。"]]},
  clothes:{label:"服・シワ",hint:"服が平面的・シワが不自然",practices:[
    ["15分","シワの7パターン","引っ張り・たるみ・ねじれ・折れ・積み重なりなどを分けて描く。"],
    ["20分","実物の服を観察","椅子に掛けた服を描き、支点からシワが伸びる方向を確認する。"],
    ["30分","同じポーズで衣装替え","1つの素体に3種類の服を着せて描く。"]]},
  speed:{label:"完成力・スピード",hint:"途中で止まる・時間がかかりすぎる",practices:[
    ["60分","時間制限1枚","タイマーをかけ、ラフ15・線画20・塗り20・仕上げ5分で必ず終わらせる。"],
    ["—","工程ごとの実測","スケジュール機能の工程ごとに実際にかかった日数を記録し、次回の配分に反映する。"],
    ["—","「8割で出す」ルール","仕上げ工程で直す箇所を3つまでと決めて、それ以上はやらない。"]]},
  other:{label:"その他",hint:"上のどれにも当てはまらない",practices:[
    ["—","課題を小さく分ける","「〜がうまくなる」ではなく「〜を3回描く」のように回数や行動で書く。"],
    ["—","参考資料を3枚集める","課題に近い作品を3枚集め、何が良いのかを言葉にする。"]]}
};

/* ============ テーマ（端末ごとに記憶） ============ */
const hostTheme=document.documentElement.getAttribute("data-theme");
let themePref="auto"; try{themePref=localStorage.getItem("un-theme")||"auto"}catch(e){}
const isDark=()=>{const a=document.documentElement.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function applyTheme(){const r=document.documentElement;
  if(themePref==="auto"){hostTheme?r.setAttribute("data-theme",hostTheme):r.removeAttribute("data-theme")}else r.setAttribute("data-theme",themePref);
  const d=isDark(),b=document.getElementById("btnTheme"),ic=document.getElementById("themeIco");
  if(b){b.setAttribute("aria-label",d?"ライトモードにする":"ダークモードにする");
    ic.setAttribute("d",d?"M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z":"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z")}}
function setTheme(v){themePref=v;try{localStorage.setItem("un-theme",v)}catch(e){}applyTheme()}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);

/* ============ 状態 ============ */
let works=[]; let store=null; let sampleFn=null; let dlCap=null; let sortMode="new"; let metric="avg";
let settings=clone(DEFAULT_SETTINGS);
const axes=()=>settings.axes;
function applySettings(raw){const d=clone(DEFAULT_SETTINGS);settings={...d,...(raw||{}),hours:{...d.hours,...((raw&&raw.hours)||{})}};
  if(!Array.isArray(settings.axes)||!settings.axes.length)settings.axes=d.axes;
  if(!Array.isArray(settings.phases)||!settings.phases.length)settings.phases=d.phases;
  if(!Array.isArray(settings.holidays))settings.holidays=d.holidays;}
try{sortMode=localStorage.getItem("un-sort")||"new"}catch(e){}
let filt={q:"",preset:"all",from:"",to:"",tags:[],mode:"any"};
let galBig=false; try{galBig=localStorage.getItem("un-big")==="1"}catch(e){}
const arCache={}; let galList=[];
try{filt={...filt,...JSON.parse(localStorage.getItem("un-filter")||"{}")}}catch(e){}
const saveFilt=()=>{try{localStorage.setItem("un-filter",JSON.stringify(filt))}catch(e){}};
const allTags=()=>{const m=new Map();done().forEach(w=>(w.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));return[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"))};

/* ============ 日付 ============ */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{if(!s)return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const fmt=s=>{if(!s)return"—";const d=parse(s);return`${d.getMonth()+1}/${d.getDate()}`};
const fmtFull=s=>{if(!s)return"—";const d=parse(s);return`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 期日の自動計算：開始日〜締切の「作業可能時間」の合計を配分%で割り、各工程の時間が貯まる日を期日にする。
   平日・休日で1日の作業時間が違うので、休日が多い期間ほど早く進む計算になる。 */
const isHoliday=s=>settings.holidays.includes(parse(s).getDay());
const dayHours=(s,h)=>Math.max(0,+(isHoliday(s)?h.holiday:h.weekday)||0);
function allocate(start,due,phases,h){
  const days=[];for(let d=start;diffDays(d,due)>=0;d=addDays(d,1))days.push(d);
  const hrs=days.map(d=>dayHours(d,h)); const H=hrs.reduce((a,b)=>a+b,0);
  const W=phases.reduce((a,p)=>a+(+p.w||0),0)||1; let acc=0;
  const out=phases.map((p,i)=>{const q={...p};acc+=(+p.w||0);q.hours=Math.round(H*(+p.w||0)/W*10)/10;
    if(i===phases.length-1){q.due=due;return q}
    if(H<=0){q.due=addDays(start,Math.round((days.length-1)*acc/W));return q}
    const target=H*acc/W;let c=0,j=0;for(;j<days.length;j++){c+=hrs[j];if(c>=target-1e-6)break}
    q.due=days[Math.min(j,days.length-1)];return q});
  const hd=days.filter(isHoliday).length;
  return{phases:out,H,days:days.length,holidays:hd,weekdays:days.length-hd};
}

async function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("joutatsu-note",1);
  r.onupgradeneeded=()=>{r.result.createObjectStore("works");r.result.createObjectStore("images")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbReq(db,name,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(name,mode);const r=fn(tx.objectStore(name));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})}

function cloudStore(db,assets){
  const col=db.collection("works");
  return{kind:"cloud",
    subscribe(cb,err){return col.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err)},
    save:w=>{const{id,...rest}=w;return col.doc(id).set(JSON.parse(JSON.stringify(rest)))},
    remove:async w=>{await col.doc(w.id).delete();if(w.imageId&&assets){try{await assets.delete(w.imageId)}catch(e){}}},
    canUpload:!!assets,
    async upload(blob){const r=await assets.upload(blob);return{imageId:r.id,imageUrl:r.url}},
    src:w=>w.imageUrl||(w.imageId?"/_blob/"+w.imageId:""),
    watchSettings(cb){return db.doc("settings/main").onSnapshot(s=>cb(s.exists?s.data():null),()=>cb(null))},
    saveSettings:v=>db.doc("settings/main").set(clone(v))};
}
async function localStore(){
  const db=await idbOpen(); const urls={}; let listener=null;
  const load=async()=>{const all=await new Promise((res)=>{const out=[];const tx=db.transaction("works");const c=tx.objectStore("works").openCursor();
      c.onsuccess=()=>{const cur=c.result;if(cur){out.push(cur.value);cur.continue()}else res(out)};});
    for(const w of all){if(w.imageId&&!urls[w.imageId]){const b=await idbReq(db,"images","readonly",s=>s.get(w.imageId));if(b)urls[w.imageId]=URL.createObjectURL(b)}}
    listener&&listener(all)};
  return{kind:"local",
    subscribe(cb){listener=cb;load();return()=>{}},
    async save(w,o){const sync=o&&o.fromSync;if(!sync)w=Object.assign({},w,{updatedAt:new Date().toISOString()});
      await idbReq(db,"works","readwrite",s=>s.put(JSON.parse(JSON.stringify(w)),w.id));await load();if(!sync&&window.onLocalChange)window.onLocalChange()},
    async remove(w,o){const sync=o&&o.fromSync;if(!sync&&window.onLocalDelete)window.onLocalDelete(w.id);
      await idbReq(db,"works","readwrite",s=>s.delete(w.id));if(w.imageId)await idbReq(db,"images","readwrite",s=>s.delete(w.imageId));await load();if(!sync&&window.onLocalChange)window.onLocalChange()},
    async getImage(id){return await idbReq(db,"images","readonly",s=>s.get(id))},
    canUpload:true,
    async upload(blob){const id=uid();await idbReq(db,"images","readwrite",s=>s.put(blob,id));urls[id]=URL.createObjectURL(blob);return{imageId:id,imageUrl:""}},
    src:w=>w.imageId?urls[w.imageId]||"":"",
    watchSettings(cb){let v=null;try{v=JSON.parse(localStorage.getItem("un-settings")||"null")}catch(e){}cb(v);return()=>{}},
    async saveSettings(v,o){const sync=o&&o.fromSync;if(!sync)v.updatedAt=new Date().toISOString();try{localStorage.setItem("un-settings",JSON.stringify(v))}catch(e){}applySettings(v);render();if(!sync&&window.onLocalChange)window.onLocalChange()}};
}

/* 画像を長辺2400pxに縮小して容量を節約 */
async function shrink(file){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)) return file;
  const bmp=await createImageBitmap(file); const max=2400;
  if(Math.max(bmp.width,bmp.height)<=max&&file.size<4e6) return file;
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));
}

/* ============ 日付欄に曜日を表示 ============
   ブラウザ標準の日付欄は、Windowsの日付形式によって曜日が「()」と空で表示されることがある。
   標準の欄はそのまま使い（カレンダーで選ぶ）、表示だけ「2026/11/03（火）」の形に重ねる。 */
const dateText=v=>{if(!v)return"";const d=parse(v);return`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${"日月火水木金土"[d.getDay()]}）`};
const nativeValue=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");
function enhanceDate(inp){
  if(inp.dataset.enh)return;inp.dataset.enh="1";
  const wrap=document.createElement("span");wrap.className="datefield";inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);
  const lab=document.createElement("span");lab.className="date-label";lab.setAttribute("aria-hidden","true");wrap.appendChild(lab);
  const upd=()=>{const v=nativeValue.get.call(inp);lab.textContent=v?dateText(v):"日付を選択";lab.classList.toggle("empty",!v)};
  Object.defineProperty(inp,"value",{configurable:true,get(){return nativeValue.get.call(inp)},set(v){nativeValue.set.call(inp,v);upd()}});
  inp.addEventListener("input",upd);inp.addEventListener("change",upd);
  const open=()=>{try{inp.showPicker&&inp.showPicker()}catch(e){}};
  inp.addEventListener("click",open);inp.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  upd();
}
const enhanceAll=root=>root.querySelectorAll('input[type="date"]').forEach(enhanceDate);
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches&&n.matches('input[type="date"]'))enhanceDate(n);else enhanceAll(n)}}))).observe(document.body,{childList:true,subtree:true});

        <span class="m" role="img" aria-label="達成度${w.reflection.achieved}/5">${[1,2,3,4,5].map(n=>`<i class="${n<=w.reflection.achieved?"on":""}"></i>`).join("")}</span>
        <span class="w">${fmtFull(w.completedAt)}「${esc(w.title)}」でふり返り</span></div>`).join(""):`<p class="hint">前回の課題をふり返ると、ここに達成度が並びます。</p>`}</div>
    </div>
  </div>`;
  $("metric").value=metric;
  $("metric").onchange=e=>{metric=e.target.value;$("chartWrap").innerHTML=lineChart(done().slice().reverse());bindChart()};
  bindChart();
}
function lineChart(list){
  const pts=list.map(w=>({w,v:metricOf(w)})).filter(p=>p.v!=null);
  if(pts.length<2)return`<p class="hint">2作以上記録すると推移のグラフが出ます。</p>`;
  const W=600,H=220,L=28,Rt=14,T=14,B=28;
  const x=i=>L+(pts.length===1?0:(W-L-Rt)*i/(pts.length-1)), y=v=>T+(H-T-B)*(5-v)/4;
  const grid=[1,2,3,4,5].map(v=>`<line x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=`${line}L${x(pts.length-1)},${y(1)}L${x(0)},${y(1)}Z`;
  const step=Math.ceil(pts.length/6);
  const xl=pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${fmt(p.w.completedAt)}</text>`:"").join("");
  const dots=pts.map((p,i)=>{const lastP=i===pts.length-1;return`<circle cx="${x(i)}" cy="${y(p.v)}" r="${lastP?5:3.5}" fill="${lastP?"var(--accent)":"var(--sheet)"}" stroke="var(--accent)" stroke-width="2"/>`}).join("");
  const hits=pts.map((p,i)=>`<rect class="hit" x="${x(i)-Math.max(12,(W-L-Rt)/pts.length/2)}" y="${T}" width="${Math.max(24,(W-L-Rt)/pts.length)}" height="${H-T-B}" fill="transparent" data-i="${i}" data-x="${x(i)}" data-y="${y(p.v)}" data-t="${esc(p.w.title)}" data-d="${fmtFull(p.w.completedAt)}" data-v="${p.v.toFixed(1)}"/>`).join("");
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="自己評価の推移"><g class="grid">${grid}</g>
    <path d="${area}" fill="var(--accent)" fill-opacity=".08"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-2)" stroke-dasharray="3 3" visibility="hidden"/>${dots}${xl}${hits}</svg><div class="tip" id="tip" hidden></div>`;
}
function bindChart(){
  const wrap=$("chartWrap"),svg=wrap&&wrap.querySelector("svg");if(!svg)return;const tip=$("tip"),cross=$("cross");
  const show=r=>{const k=svg.getBoundingClientRect().width/600;tip.innerHTML=`<b>${r.dataset.v}</b> ${r.dataset.t}<br><span style="opacity:.7">${r.dataset.d}</span>`;
    tip.style.left=Math.min(Math.max(+r.dataset.x*k,70),wrap.clientWidth-70)+"px";tip.style.top=(+r.dataset.y*k)+"px";tip.hidden=false;
    cross.setAttribute("x1",r.dataset.x);cross.setAttribute("x2",r.dataset.x);cross.setAttribute("visibility","visible")};
  svg.querySelectorAll(".hit").forEach(r=>{r.addEventListener("pointerenter",()=>show(r));r.addEventListener("click",()=>show(r))});
  svg.addEventListener("pointerleave",()=>{tip.hidden=true;cross.setAttribute("visibility","hidden")});
}

/* 入力画面（記録・計画・設定）は、保存せずに閉じようとしたら確認する。

/* 課題候補：今回の点数と直近3作の点数を平均し、低い項目から最大3つ */
function suggestions(scores,selfId){
  const hist=done().filter(w=>w.id!==selfId).slice(0,3);
  const rows=axes().map(a=>{const vals=[scores[a.key],...hist.map(w=>w.review&&w.review.scores&&w.review.scores[a.key])].filter(x=>x>0);
    return vals.length?{a,m:vals.reduce((x,y)=>x+y,0)/vals.length,n:vals.length}:null}).filter(Boolean).sort((x,y)=>x.m-y.m);

}

/* 実績からの配分提案：工程ごとに「実際に使えた作業時間」を出し、作品内での割合を工程名ごとに平均する。
   工程の区切りは各工程の完了日（最後の工程は完成日でも可）。直近5作まで。 */
function phaseActuals(w){
  const ph=w.phases||[]; if(!w.start||ph.length<2)return null;
  const ends=ph.map((p,i)=>p.doneAt||(i===ph.length-1?w.completedAt:null));
  if(ends.some(e=>!e))return null;
  const h=w.hours||settings.hours; let prev=null; const out=[];
  for(let i=0;i<ph.length;i++){
    let from=prev?addDays(prev,1):w.start, to=ends[i]; let hrs=0;
    for(let d=from;diffDays(d,to)>=0;d=addDays(d,1))hrs+=dayHours(d,h);
    if(hrs<=0)hrs=Math.max(0.5,dayHours(to,h)*0.5); // 同じ日に複数工程を終えた場合は半日分とみなす
    const planned=ph[i].due?diffDays(ph[i].due,ends[i]):null;
    out.push({name:ph[i].name,hours:hrs,late:planned});prev=diffDays(prev||w.start,to)>=0?to:prev;
  }
  const tot=out.reduce((a,x)=>a+x.hours,0);
  return out.map(x=>({...x,share:x.hours/tot*100}));
}
function suggestShares(phases){
  const src=works.filter(w=>w.status==="done").sort((a,b)=>(b.completedAt||"").localeCompare(a.completedAt||"")).map(w=>({w,a:phaseActuals(w)})).filter(x=>x.a).slice(0,5);
  if(!src.length)return null;
  const stat={};src.forEach(({a})=>a.forEach(x=>{(stat[x.name]=stat[x.name]||{s:[],l:[]}).s.push(x.share);if(x.late!=null)stat[x.name].l.push(x.late)}));
  const known=phases.filter(p=>stat[p.name]); if(!known.length)return null;
  // 実績がない工程は今の配分を据え置き、実績のある工程で残りを按分
  const unknownW=phases.filter(p=>!stat[p.name]).reduce((a,p)=>a+(+p.w||0),0);
  const raw=phases.map(p=>stat[p.name]?mean(stat[p.name].s):null);
  const rawSum=raw.reduce((a,v)=>a+(v||0),0);
  let vals=phases.map((p,i)=>raw[i]==null?(+p.w||0):Math.max(5,Math.round(raw[i]/rawSum*(100-unknownW)/5)*5));
  const diff=100-vals.reduce((a,b)=>a+b,0); if(diff){const k=vals.indexOf(Math.max(...vals));vals[k]+=diff}
  return{n:src.length,vals,late:phases.map(p=>stat[p.name]&&stat[p.name].l.length?mean(stat[p.name].l):null)};
}


/* ============ お題ガチャ ============
   3つの枠（だれ・何／どこ・状況／雰囲気）から1語ずつ。どこ・状況と雰囲気には季節・色・テーマの言葉も混ぜ、
   今の季節の語は出やすくする。4つ目に「練習ポイント」（いまの課題から）、作業時間から「描く範囲」を添える。 */
const GACHA={
  who:["魔女","騎士","探偵","料理人","郵便配達員","天使","悪魔","吸血鬼","人魚","竜","狐の神様","黒猫","ロボット","アンドロイド","宇宙飛行士","図書館の司書","花屋","パン屋","バンドのギタリスト","生徒会長","双子","幼なじみ","王子","お姫様","海賊","忍者","侍","巫女","魔法少女","錬金術師","旅人","冒険者","喫茶店のマスター","絵描き","写真家","時計職人","庭師","シスター","占い師","怪盗","執事","メイド","魔王","勇者","妖精","鬼","天狗","幽霊","科学者","医者","消防士","車掌","気象予報士","書道家","和菓子職人","狼","うさぎ","ペンギン","くま","金魚","白い鳥","雪だるま","人形","ドラゴンの子ども","剣士","弓使い","吟遊詩人","商人","船乗り","ダンサー"],
  where:["雨上がりの駅","夜の図書館","学校の屋上","放課後の教室","古本屋","海辺の灯台","森の奥の小屋","廃墟の遊園地","路地裏","深夜のコンビニ","星空の丘","水族館","美術館","喫茶店の窓際","夕焼けの帰り道","満員電車","宇宙ステーション","砂漠のオアシス","空に浮かぶ島","地下鉄のホーム","雨の交差点","誕生日の朝","引っ越しの日","試験前夜","待ち合わせ","寝坊した朝","料理の途中","昼寝","雨宿り","旅立ちの日","別れの駅","告白の直前","勝利の瞬間","戦いの後","秘密基地","屋台","温泉","神社の境内","城の大広間","市場","港町","花畑","温室","時計塔の中","夜行列車","ゲームセンター","洗濯物を干す","猫に囲まれる","手紙を書く","傘を差し出す","空を見上げる","振り返る瞬間","寝起き","魔法の練習","ケーキを作る","電話をしている"],
  mood:["レトロ","ノスタルジック","幻想的","ポップ","クール","ゆるい","切ない","不穏","神秘的","爽やか","ほっこり","ダーク","きらきら","静けさ","疾走感","和風","中華風","スチームパンク","サイバーパンク","童話風","青","赤","白と黒","モノクロ","パステルカラー","くすみカラー","金色","緑","紫","ネオン","セピア","補色","朝焼け","月明かり","雨音","約束","秘密","再会","旅立ち","憧れ","嘘","祈り","願い","記憶","孤独","友情","勇気","初恋","後悔","希望","日常","非日常","自由","夢"],
  season:{
    spring:{where:["桜並木","入学式","お花見","春一番の丘","菜の花畑"],mood:["桜色","新生活","春の陽だまり","若葉色"]},
    summer:{where:["夏祭り","花火大会","海水浴","ひまわり畑","風鈴の縁側","夕立"],mood:["夏の青","蝉時雨","入道雲","ラムネ色"]},
    autumn:{where:["紅葉の山道","ハロウィン","お月見","落ち葉の公園","読書の秋"],mood:["茜色","金木犀","実りの秋","秋の夜長"]},
    winter:{where:["クリスマスの夜","初詣","雪合戦","こたつ","大晦日","雪の降る街"],mood:["白銀","雪明かり","ぬくもり","冬の星座"]}
  },
  points:{anatomy:["全身を入れる","ひねりのあるポーズで"],face:["表情をはっきりと","斜め45度の顔で"],hands:["手を見せる","物を持たせる"],pose:["動きのあるポーズで","ジャンプの瞬間で"],
    composition:["俯瞰の構図で","あおりの構図で","三分割構図で","対角線の構図で"],perspective:["背景をしっかり（二点透視）","アイレベルを決めて背景を入れる"],lineart:["線の強弱を意識して"],
    color:["3色だけで配色","補色を差し色に"],light:["逆光で","強い光源をひとつ決めて"],painting:["質感を描き分ける（布と金属）"],clothes:["服のシワを多めに","重ね着で"],speed:["時間内に必ず完成","仕上げは3か所まで"],other:["今の課題を意識して"]}
};
const seasonKey=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?"spring":m<=8&&m>=6?"summer":m>=9&&m<=11?"autumn":"winter"};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function drawWord(slot,not){
  const ss=GACHA.season[seasonKey()];let pool=GACHA[slot];
  if(slot!=="who"&&Math.random()<0.3)pool=ss[slot]; // 今の季節の語は出やすく
  let w=pick(pool),n=0;while(w===not&&n++<5)w=pick(pool);return w;
}
function drawScale(H){return H<6?"バストアップ・1人":H<=15?"腰上〜全身・1人、簡単な背景":"全身・背景あり（2人まで）"}
function drawPoint(){const c=latestChallenge();if(!c)return"";const cat=ADVICE[c.nextChallenge.category]?c.nextChallenge.category:"other";return pick(GACHA.points[cat]||GACHA.points.other)}
function claudePrompt(g,ctx){
  const recent=done().slice(0,5).map(w=>`・${w.title}${(w.tags||[]).length?`（${w.tags.map(t=>"#"+t).join(" ")}）`:""}`).join("\n");
  const c=latestChallenge();
  return `イラストの次の作品のテーマを一緒に決めたいです。お題ガチャで次の言葉が出ました。

だれ・何：${g.who}
どこ・状況：${g.where}
雰囲気：${g.mood}
${g.point?`練習ポイント：${g.point}\n`:""}描く範囲の目安：${g.scale}
今の課題：${c?c.nextChallenge.text:"（なし）"}
制作期間：${ctx.start}〜${ctx.due}（作業できる時間は合計 約${Math.round(ctx.H)}時間）
最近描いた作品：
${recent||"（まだありません）"}

進め方（一問一答でお願いします）：
- 質問は1回に1つだけしてください。私が答えるまで、次の質問やテーマ案に進まないでください。
- 各質問には答えやすいように選択肢を3〜4個（A〜D）付け、最後に「その他（自由に書く）」も入れてください。
- 質問は全部で3問です。例えば「今の気分」「いちばん描きたい要素（キャラ・背景・小物など）」「見せ場にしたいところ」のように、テーマを絞り込める順番で聞いてください。
- 3問の答えがそろったら、テーマ案を3つ出してください。各案に「タイトル」「どんな場面か」「構図のアイデア」「見せ場」を付けてください。お題の言葉は全部使わなくても、ふくらませてもかまいません。最近の作品と題材がかぶりすぎないようにしてください。
- 私が案を選んだら、上達ノートのテーマ欄に貼れるように、テーマを1行でまとめてください。

では、1問目だけをお願いします。`;
}
function setupGacha(w,getCtx){
  const g=Object.assign({who:"",where:"",mood:"",point:"",scale:"",lock:{},usePoint:true},w.theme&&w.theme.gacha||{});g.lock={};
  let used=!!(w.theme&&w.theme.source==="gacha");
  const panel=$("gacha");
  const slots=[["who","だれ・何"],["where","どこ・状況"],["mood","雰囲気"]];
  const roll=(all)=>{slots.forEach(([k])=>{if(all?!g.lock[k]:true)g[k]=drawWord(k,g[k])});g.point=drawPoint();g.scale=drawScale(getCtx().H)};
  const draw=()=>{
    const ctx=getCtx();g.scale=drawScale(ctx.H);
    panel.innerHTML=`<div class="gacha-slots">${slots.map(([k,l])=>`<div class="gslot ${g.lock[k]?"locked":""}"><span class="label">${l}</span><b>${esc(g[k])}</b>
        <span class="gbtns"><button type="button" class="btn sm ghost" data-glock="${k}" aria-pressed="${!!g.lock[k]}">${g.lock[k]?"固定中":"固定"}</button><button type="button" class="btn sm ghost" data-groll="${k}" ${g.lock[k]?"disabled":""}>引き直す</button></span></div>`).join("")}</div>
      <div class="gextra">
        ${g.point?`<label class="toggle"><input type="checkbox" id="gPoint" ${g.usePoint?"checked":""}><span>練習ポイント：<b>${esc(g.point)}</b><br><span class="hint">いまの課題「${esc(latestChallenge().nextChallenge.text)}」から</span></span></label>`:`<p class="hint">いまの課題を決めると、ここに練習ポイントが付きます。</p>`}
        <p class="hint">描く範囲の目安：<b>${esc(g.scale)}</b>（作業できる時間 約${Math.round(ctx.H)}時間）</p>
      </div>
      <div class="gactions"><button type="button" class="btn sm" id="gAll">ぜんぶ引き直す</button><button type="button" class="btn sm primary" id="gUse">このお題で描く</button>
        ${settings.useClaude?`<a class="btn sm" id="gClaude" target="_blank" rel="noopener">Claudeで相談する ↗</a><button type="button" class="btn sm ghost" id="gCopy">相談文をコピー</button>`:""}</div>
      ${settings.useClaude?`<p class="hint">claude.ai が開き、お題と今の課題・最近の作品を伝えた状態で相談を始められます。決まったテーマを上の「テーマ」欄に貼ってください。</p>`:""}`;
    panel.querySelectorAll("[data-glock]").forEach(b=>b.onclick=()=>{const k=b.dataset.glock;g.lock[k]=!g.lock[k];draw()});
    panel.querySelectorAll("[data-groll]").forEach(b=>b.onclick=()=>{const k=b.dataset.groll;g[k]=drawWord(k,g[k]);draw()});
    const gp=$("gPoint");if(gp)gp.onchange=()=>{g.usePoint=gp.checked};
    $("gAll").onclick=()=>{roll(true);draw()};
    $("gUse").onclick=()=>{const t=`${g.who} × ${g.where} × ${g.mood}${g.point&&g.usePoint?`（練習：${g.point}）`:""}`;$("pTheme").value=t;used=true;
      if(!$("pTitle").value.trim())$("pTitle").value=`${g.where}の${g.who}`;dlgDirty=true;toast("テーマに入れました")};
    const prompt=()=>claudePrompt(Object.assign({},g,{point:g.usePoint?g.point:""}),getCtx());
    const gc=$("gClaude");if(gc){gc.href="https://claude.ai/new?q="+encodeURIComponent(prompt());gc.onmouseenter=gc.onfocus=()=>{gc.href="https://claude.ai/new?q="+encodeURIComponent(prompt())};gc.onclick=()=>{used=true}}
    const cp=$("gCopy");if(cp)cp.onclick=()=>{const t=prompt();navigator.clipboard.writeText(t).then(()=>toast("相談文をコピーしました。Claudeに貼り付けてください")).catch(()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("相談文をコピーしました")}catch(e){toast("コピーできませんでした")}ta.remove()})};
  };
  $("gachaBtn").onclick=()=>{if(panel.hidden){if(!g.who)roll(false);panel.hidden=false;draw();$("gachaBtn").textContent="お題ガチャを閉じる"}else{panel.hidden=true;$("gachaBtn").textContent="お題ガチャを引く"}};
  return{collect(){const text=$("pTheme").value.trim();if(!text)return null;
    return{text,source:used?"gacha":"manual",gacha:used?{who:g.who,where:g.where,mood:g.mood,point:g.usePoint?g.point:"",scale:g.scale}:undefined}}};
}

/* --- 制作の計画（スケジュール） --- */
function openPlan(existing){
  const w=existing?clone(existing):{id:uid(),title:"",status:"wip",createdAt:today(),start:today(),due:addDays(today(),14),
    phases:settings.phases.map(p=>({...p,done:false})),hours:{...settings.hours}};
  if(!w.hours)w.hours={...settings.hours};
  let phases=w.phases.map(p=>({name:p.name,w:+p.w||0,done:!!p.done,due:p.due}));
  let info=null;
  const recompute=()=>{w.start=$("pStart").value;w.due=$("pDue").value;
    w.hours={weekday:+$("pWd").value||0,holiday:+$("pHd").value||0};
    if(!w.start||!w.due||diffDays(w.start,w.due)<0){$("pSum").textContent="締切は開始日より後にしてください";return}
    info=allocate(w.start,w.due,phases,w.hours);phases=info.phases;drawTable()};
  const drawTable=()=>{
    const totalW=phases.reduce((a,p)=>a+(+p.w||0),0);
    $("pTable").innerHTML=`<thead><tr><th>工程</th><th>配分%</th><th>作業時間</th><th>期日</th><th>完了</th><th></th></tr></thead><tbody>${
      phases.map((p,i)=>`<tr>
      <td><span class="dot" style="background:${phaseColor(p.name)}"></span><input type="text" value="${esc(p.name)}" data-i="${i}" data-k="name" style="width:96px;padding:4px 6px" aria-label="工程名"></td>
      <td><input type="number" min="0" max="100" step="5" value="${p.w}" data-i="${i}" data-k="w" aria-label="配分"></td>
      <td class="mono">${p.hours!=null?p.hours.toFixed(1)+"h":"—"}</td>
      <td class="mono">〜${fmt(p.due)}（${p.due?WEEK[parse(p.due).getDay()]:""}）</td>
      <td><input type="checkbox" ${p.done?"checked":""} data-i="${i}" data-k="done" aria-label="完了"></td>
      <td><button type="button" class="btn sm ghost" data-rm="${i}" aria-label="工程を削除">×</button></td></tr>`).join("")}</tbody>`;
    const sg=suggestShares(phases);
    $("pSuggest").innerHTML=!sg?`<p class="hint">工程を「完了」ボタンで進めて作品を完成させると、実際にかかった時間から配分を提案します。</p>`:
      (sg.vals.every((v,i)=>v===(+phases[i].w||0))?`<p class="hint">今の配分は過去${sg.n}作の実績どおりです。</p>`:
      `<div class="suggest-box"><span class="label">過去${sg.n}作の実績からの提案</span>
       <div class="vals">${phases.map((p,i)=>`<span>${esc(p.name)} <b>${sg.vals[i]}%</b>${sg.vals[i]!==(+p.w||0)?`<span class="diff">（今 ${p.w}%）</span>`:""}</span>`).join("")}</div>
       ${sg.late.some(x=>x!=null&&Math.abs(x)>=1)?`<span class="diff">予定との差：${phases.map((p,i)=>sg.late[i]!=null&&Math.abs(sg.late[i])>=1?`${esc(p.name)}は平均${Math.abs(sg.late[i]).toFixed(1)}日${sg.late[i]>0?"遅れ":"早く完了"}`:null).filter(Boolean).join("、")}</span>`:""}
       <div><button class="btn sm primary" type="button" id="pUseSg">この配分を使う</button></div></div>`);
    const us=$("pUseSg"); if(us)us.onclick=()=>{phases=phases.map((p,i)=>({...p,w:sg.vals[i]}));recompute();toast("実績の配分にしました")};
    $("pSum").innerHTML=`配分合計 <b class="mono" style="color:${totalW===100?"inherit":"var(--warn)"}">${totalW}%</b>${totalW===100?"":"（100%になるよう比率で計算します）"} ・ 全${info.days}日（平日${info.weekdays}日・休日${info.holidays}日） ・ 作業可能 <b class="mono">${Math.round(info.H*10)/10}h</b>`;
  };
  guardNext();openDlg(`${head(existing?"スケジュールを編集":"制作を計画")}
  <div class="dlg-body">
    <fieldset><legend>作品</legend>
      <div class="f"><label for="pTitle">タイトル（仮でOK）</label><input type="text" id="pTitle" value="${esc(w.title)}" placeholder="例：秋の制服イラスト"></div>
      <div class="row">
        <div class="f"><label for="pStart">開始日</label><input type="date" id="pStart" value="${esc(w.start)}"></div>
        <div class="f"><label for="pDue">完成させる日</label><input type="date" id="pDue" value="${esc(w.due)}"></div>
      </div>
      <div class="row">
        <div class="f"><label for="pWd">平日の作業時間（h/日）</label><input type="text" inputmode="decimal" id="pWd" value="${w.hours.weekday}"></div>
        <div class="f"><label for="pHd">休日の作業時間（h/日）</label><input type="text" inputmode="decimal" id="pHd" value="${w.hours.holiday}"></div>
      </div>
      ${(()=>{const c=latestChallenge();return c?`<div class="prev-box"><span class="label">この作品で取り組む課題</span><b>${esc(c.nextChallenge.text)}</b></div>`:""})()}
    </fieldset>
    <fieldset><legend>テーマ</legend>
      <div class="f"><label for="pTheme">何を描くか（任意）</label><input type="text" id="pTheme" value="${esc(w.theme&&w.theme.text)}" placeholder="例：雨上がりの駅にいる魔女（レトロ）"></div>
      <div><button class="btn sm" type="button" id="gachaBtn">お題ガチャを引く</button> <span class="hint">描きたいものが決まらないときに</span></div>
      <div id="gacha" class="gacha" hidden></div>
    </fieldset>
    <fieldset><legend>工程と期日</legend>
      <p class="hint" id="pSum"></p>
      <div id="pSuggest"></div>
      <p class="hint">期日は「作業可能時間の合計 × 配分%」から自動で計算します。休日（${settings.holidays.map(d=>WEEK[d]).join("・")||"なし"}）は作業時間が長い前提です。初期値は「設定」で変えられます。</p>
      <div class="tbl-wrap"><table class="phase-table" id="pTable"></table></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="pAddPh">＋ 工程を追加</button><button class="btn sm ghost" type="button" id="pReset">設定の初期値に戻す</button></div>
    </fieldset>
  </div>
  <div class="dlg-foot">${existing?`<button class="btn danger" type="button" id="btnDel" style="margin-right:auto">削除</button>`:""}<button class="btn" type="button" data-close>キャンセル</button><button class="btn primary" type="button" id="pSave">保存</button></div>`,
  ()=>{
    recompute();
    const gacha=setupGacha(w,()=>({H:info?info.H:0,start:w.start,due:w.due}));
    ["pStart","pDue","pWd","pHd"].forEach(id=>$(id).addEventListener("change",recompute));
    const tbl=$("pTable");
    tbl.addEventListener("change",e=>{const t=e.target,i=+t.dataset.i,k=t.dataset.k;if(isNaN(i))return;
      if(k==="w"){phases[i].w=Math.max(0,+t.value||0);recompute()}
      else if(k==="done"){phases[i].done=t.checked}
      else if(k==="name"){phases[i].name=t.value;drawTable()}});
    tbl.addEventListener("click",e=>{const rm=e.target.closest("[data-rm]");if(rm&&phases.length>1){phases.splice(+rm.dataset.rm,1);recompute()}});
    $("pAddPh").onclick=()=>{phases.splice(phases.length-1,0,{name:"新しい工程",w:10,done:false});recompute()};
    $("pReset").onclick=()=>{phases=settings.phases.map(p=>({...p,done:false}));$("pWd").value=settings.hours.weekday;$("pHd").value=settings.hours.holiday;recompute()};
    if($("btnDel"))$("btnDel").onclick=()=>confirmDelete(existing);
    $("pSave").onclick=async()=>{
      const title=$("pTitle").value.trim();if(!title){$("pTitle").focus();toast("タイトルを入れてください");return}
      if(!w.start||!w.due||diffDays(w.start,w.due)<0){toast("締切は開始日より後にしてください");return}
      w.title=title;w.phases=phases;w.theme=gacha.collect();
      if(w.theme&&w.theme.source==="gacha"){w.tags=[...new Set([...(w.tags||[]),"お題ガチャ"])]}w.updatedAt=new Date().toISOString();
      try{await store.save(w);closeDlg();toast("スケジュールを保存しました")}catch(e){console.error(e);toast("保存できませんでした")}
    };
  });
}

/* --- 設定 --- */
function openSettings(){
  const st=clone(settings);
  const catSel=(v,i)=>`<select data-i="${i}" data-k="cat" aria-label="対応する練習の分類">${Object.entries(ADVICE).map(([k,a])=>`<option value="${k}" ${k===v?"selected":""}>練習：${a.label}</option>`).join("")}</select>`;
  let sorting=false;
  const drawAxes=()=>{const ax=$("sAxes");ax.classList.toggle("sorting",sorting);$("sSort").textContent=sorting?"並び替えを終える":"並び替え";$("sSort").classList.toggle("primary",sorting);
    $("sAddAx").hidden=$("sResetAx").hidden=sorting;
    $("sHint").textContent=sorting?"項目をドラッグして順番を変えてください。終わったら「並び替えを終える」を押します。":"項目名と、点数が低いときに出す練習の分類を選べます。項目を消しても、過去の作品についた点数は残ります。";
    if(sorting){ax.innerHTML=st.axes.map((a,i)=>`<div class="set-row" data-idx="${i}"><button type="button" class="handle" aria-label="${esc(a.label)}（矢印キーで移動）">⠿</button><b>${esc(a.label)}</b></div>`).join("");return}
    ax.innerHTML=st.axes.map((a,i)=>`<div class="set-row" data-idx="${i}">

    // ドラッグ＆ドロップ（マウス・タッチ共通）。行の順番をDOM上で入れ替え、離したときに st.axes に反映
    const commitOrder=()=>{st.axes=[...ax.children].map(r=>st.axes[+r.dataset.idx])};
    $("sSort").onclick=()=>{sorting=!sorting;drawAxes()};
    let drag=null;
    ax.addEventListener("pointerdown",e=>{if(!sorting||e.button>0)return;const row=e.target.closest(".set-row");if(!row)return;e.preventDefault();
      drag={row};row.classList.add("dragging");row.setPointerCapture(e.pointerId)});
    ax.addEventListener("pointermove",e=>{if(!drag)return;
      const rows=[...ax.children].filter(r=>r!==drag.row);
      const next=rows.find(r=>{const b=r.getBoundingClientRect();return e.clientY<b.top+b.height/2})||null;
      if(next!==drag.row.nextElementSibling)ax.insertBefore(drag.row,next)});
    const endDrag=()=>{if(!drag)return;const i=[...ax.children].indexOf(drag.row);drag.row.classList.remove("dragging");drag=null;commitOrder();drawAxes();ax.children[i].querySelector(".handle").focus()};
    ax.addEventListener("pointerup",endDrag);ax.addEventListener("pointercancel",endDrag);
    ax.addEventListener("keydown",e=>{const h=e.target.closest(".handle");if(!h||!["ArrowUp","ArrowDown"].includes(e.key))return;e.preventDefault();
      const row=h.closest(".set-row");const sib=e.key==="ArrowUp"?row.previousElementSibling:row.nextElementSibling;if(!sib)return;
      ax.insertBefore(row,e.key==="ArrowUp"?sib:sib.nextElementSibling);const i=[...ax.children].indexOf(row);commitOrder();drawAxes();ax.children[i].querySelector(".handle").focus()});
    $("sAddAx").onclick=()=>{st.axes.push({key:"c_"+uid(),label:"新しい項目",cat:"other"});drawAxes();const l=ax.querySelectorAll("input[type=text]");l[l.length-1].select()};

    ph.addEventListener("click",e=>{const rm=e.target.closest("[data-rmp]");if(rm){st.phases.splice(+rm.dataset.rmp,1);drawPh()}});
    $("sAddPh").onclick=()=>{st.phases.push({name:"新しい工程",w:10});drawPh()};
    $("sSave").onclick=async()=>{
      st.axes=st.axes.map(a=>({...a,label:a.label.trim()||"無題の項目"}));
      st.suggest=$("sSuggest").checked;st.useClaude=$("sClaude").checked;
      st.hours={weekday:Math.max(0,+$("sWd").value||0),holiday:Math.max(0,+$("sHd").value||0)};
      st.holidays=[...document.querySelectorAll("[data-day]:checked")].map(x=>+x.value);
      try{await store.saveSettings(st);applySettings(st);render();closeDlg();toast("設定を保存しました")}catch(e){console.error(e);toast("保存できませんでした")}
    };
  });
}

/* --- 作品詳細 --- */
function radar(w){
  const scores=(w.review&&w.review.scores)||{}; const labels=(w.review&&w.review.labels)||{};
  const list=axes().map(a=>[a.key,a.label]);
  Object.keys(scores).forEach(k=>{if(!list.some(x=>x[0]===k)&&scores[k]>0)list.push([k,labels[k]||k])});
  if(list.length<3)return`<div class="stars">${list.map(([k,l])=>`<span>${esc(l)}</span><span class="mono">${scores[k]||"-"}</span>`).join("")}</div>`;
  const n=list.length,cx=120,cy=105,R=70;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const rings=[1,2,3,4,5].map(k=>`<polygon points="${list.map((_,i)=>pt(i,R*k/5).join(",")).join(" ")}" fill="none" stroke="var(--rule)"/>`).join("");
  const poly=list.map(([k],i)=>pt(i,R*(scores[k]||0)/5).join(",")).join(" ");
  const lab=list.map(([k,l],i)=>{const[x,y]=pt(i,R+18);return`<text x="${x}" y="${y+4}" text-anchor="middle">${esc(l)} ${scores[k]||"-"}</text>`}).join("");
  return`<svg class="radar" viewBox="0 0 240 210" width="100%" style="max-width:320px" role="img" aria-label="自己評価レーダー">${rings}<polygon points="${poly}" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/>${lab}</svg>`;
}
const starHTML=v=>{const n=Math.round(v||0);return"★".repeat(n)+`<span class="off">${"★".repeat(5-n)}</span>`};
function scoreBlock(w){
  const sc=(w.review&&w.review.scores)||{}, lb=(w.review&&w.review.labels)||{};
  const rows=axes().map(a=>[a.key,a.label]); Object.keys(sc).forEach(k=>{if(!rows.some(r=>r[0]===k)&&sc[k]>0)rows.push([k,lb[k]||k])});
  const a=avg(w);
  return`<div class="d-score"><span class="label">自己評価</span><span class="st" aria-hidden="true">${starHTML(a)}</span><b>${a!=null?a.toFixed(1):"—"}</b></div>
    <div class="d-rows">${rows.map(([k,l])=>`<span>${esc(l)}</span><span class="st" aria-label="${sc[k]||0}点">${sc[k]?starHTML(sc[k]):'<span class="muted">—</span>'}</span>`).join("")}</div>`;
}

  </div>

/* ============ 保存先とバックアップ ============ */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const storagePref=()=>lsGet("un-storage")||"local";
const lastBackup=()=>lsGet("un-lastbackup");
function openStorage(){
  const cur=storagePref();
  openDlg(`${head("保存先とバックアップ")}
  <div class="dlg-body">
    <fieldset><legend>保存先</legend>
      <div id="drivePanel" style="display:flex;flex-direction:column;gap:12px"></div>

      <p class="hint">最後のバックアップ：<b>${lastBackup()?fmtFull(lastBackup()):"まだありません"}</b> ・ 作品 ${done().length}点・制作中 ${wip().length}件</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="bkExport">バックアップを書き出す</button><button class="btn ghost" type="button" id="bkImport">バックアップから復元</button><input type="file" id="bkFile" accept=".zip,application/zip" hidden></div>
      <p class="hint" id="bkMsg" aria-live="polite"></p>
    </fieldset>
  </div>
  <div class="dlg-foot"><button class="btn" type="button" id="stBack">設定に戻る</button><button class="btn primary" type="button" data-close>閉じる</button></div>`,
  ()=>{
    if(window.drive)drive.renderPanel($("drivePanel"));
    $("stBack").onclick=openSettings;
    $("bkExport").onclick=exportBackup;
    $("bkImport").onclick=()=>$("bkFile").click();
    $("bkFile").onchange=e=>{const f=e.target.files[0];if(f)confirmImport(f);e.target.value=""};
  });
}
const extOf=t=>t==="image/png"?"png":t==="image/webp"?"webp":"jpg";
async function exportBackup(){
  const msg=$("bkMsg"),btn=$("bkExport");
  if(!window.JSZip){msg.textContent="ZIPを作る部品を読み込めませんでした。通信状態を確認して、開き直してください。";return}
  btn.disabled=true;msg.textContent="作品をまとめています…";
  try{
    const zip=new JSZip(),root=zip.folder("上達ノート"),imgs=root.folder("作品"),recs=root.folder("記録");
    let n=0,miss=0;const list=works.filter(w=>!w.sample);
    for(const w of list){
      const rec=clone(w);delete rec.imageUrl;
      const src=store.src(w);
      if(src){try{const r=await fetch(src);if(!r.ok)throw 0;const b=await r.blob();const name=`${w.id}.${extOf(b.type)}`;imgs.file(name,b);rec.imageFile="作品/"+name}catch(e){miss++}}
      recs.file(`${w.id}.json`,JSON.stringify(rec,null,2));n++;msg.textContent=`作品をまとめています…（${n}/${list.length}）`;
    }
    root.file("設定.json",JSON.stringify(settings,null,2));
    root.file("このファイルについて.txt",`上達ノートのバックアップ
書き出し日: ${today()}
作品・制作中: ${list.length}件

「作品」フォルダに画像、「記録」フォルダに自己評価やスケジュールなどの記録が入っています。
アプリの「設定 → 保存先とバックアップ → バックアップから復元」で読み込めます。
`);
    root.file("manifest.json",JSON.stringify({app:"joutatsu-note",format:1,exportedAt:new Date().toISOString(),count:list.length}));
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    const filename=`上達ノート_バックアップ_${today().replace(/-/g,"")}.zip`;
    if(dlCap){await dlCap.save({filename,data:blob})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500)}
    lsSet("un-lastbackup",today());
    msg.textContent=`${list.length}件を書き出しました（${(blob.size/1048576).toFixed(1)}MB）${miss?`。画像${miss}枚は読み込めず、記録だけ入れています`:""}`;
  }catch(e){console.error(e);msg.textContent=e&&e.code==="declined"?"保存をキャンセルしました。":"書き出せませんでした。もう一度お試しください。"}
  btn.disabled=false;
}
async function confirmImport(file){
  if(!window.JSZip){toast("ZIPを読む部品を読み込めませんでした");return}
  let zip,recs=[],sets=null;
  try{zip=await JSZip.loadAsync(file);
    const files=Object.values(zip.files).filter(f=>!f.dir);
    for(const f of files){if(/記録\/[^/]+\.json$/.test(f.name))recs.push({f,data:JSON.parse(await f.async("string"))});
      if(/設定\.json$/.test(f.name))sets=JSON.parse(await f.async("string"))}
  }catch(e){console.error(e);toast("上達ノートのバックアップとして読み込めませんでした");return}
  if(!recs.length){toast("このファイルには作品の記録が入っていません");return}
  const same=recs.filter(r=>works.some(w=>w.id===r.data.id)).length;
  openDlg(`${head("バックアップから復元")}
  <div class="dlg-body">
    <p style="margin:0">「${esc(file.name)}」から <b>${recs.length}件</b> を読み込みます。</p>
    ${same?`<p class="note">そのうち ${same}件 は今のデータと同じ作品です。バックアップの内容で上書きします。</p>`:""}
    <p class="hint">今あるそれ以外の作品はそのまま残ります。</p>
    ${sets?`<label class="toggle"><input type="checkbox" id="imSet"><span>設定（自己評価の項目・作業時間・工程の配分）も復元する</span></label>`:""}
    <p class="hint" id="imMsg" aria-live="polite"></p>
  </div>
  <div class="dlg-foot"><button class="btn" type="button" id="imBack">戻る</button><button class="btn primary" type="button" id="imGo">復元する</button></div>`,
  ()=>{$("imBack").onclick=openStorage;
    $("imGo").onclick=async()=>{const btn=$("imGo"),msg=$("imMsg");btn.disabled=true;let n=0,miss=0;
      try{
        for(const {data} of recs){const w=clone(data);
          if(w.imageFile){const f=zip.file("上達ノート/"+w.imageFile)||Object.values(zip.files).find(x=>x.name.endsWith(w.imageFile));
            if(f){try{const ext=w.imageFile.split(".").pop();const b=new Blob([await f.async("arraybuffer")],{type:ext==="png"?"image/png":ext==="webp"?"image/webp":"image/jpeg"});
              const r=await store.upload(b);w.imageId=r.imageId;w.imageUrl=r.imageUrl}catch(e){miss++}}else miss++}
          delete w.imageFile;await store.save(w);n++;msg.textContent=`復元しています…（${n}/${recs.length}）`}
        if(sets&&$("imSet")&&$("imSet").checked){await store.saveSettings(sets);applySettings(sets)}
        closeDlg();render();toast(`${n}件を復元しました${miss?`（画像${miss}枚は復元できませんでした）`:""}`);
      }catch(e){console.error(e);msg.textContent="途中で止まりました。もう一度お試しください。";btn.disabled=false}};
  });
}

function confirmDelete(w){

  <div class="dlg-foot"><button class="btn" type="button" data-close>やめる</button><button class="btn danger" type="button" id="cDel">削除する</button></div>`,

let toastT; function toast(msg,action){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;if(action){const b=document.createElement("button");b.type="button";b.textContent=action.label;b.onclick=()=>{t.hidden=true;action.run()};t.appendChild(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,action?6000:2600)}

/* 現在の工程を完了にする。実際に終えた日も記録（後で予定との差を見るため） */
async function completePhase(w){
  if(!w)return; const i=(w.phases||[]).findIndex(p=>!p.done); if(i<0)return;
  const before=clone(w); const nw=clone(w); nw.phases[i].done=true; nw.phases[i].doneAt=today(); nw.updatedAt=new Date().toISOString();
  try{await store.save(nw);
    const next=nw.phases[i+1];
    toast(next?`「${nw.phases[i].name}」を完了。次は「${next.name}」`:`全工程が完了しました`,{label:"元に戻す",run:async()=>{try{await store.save(before);toast("元に戻しました")}catch(e){toast("戻せませんでした")}}});
    if(!next)setTimeout(()=>openRecord(nw),400);
  }catch(e){console.error(e);toast("保存できませんでした")}
}

/* ============ イベント ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-close],[data-open],[data-edit],[data-finish],[data-act],[data-step]");if(!t)return;
  if(t.hasAttribute("data-close"))return requestClose();
  if(!store){toast("読み込み中です");return}
  const find=id=>works.find(w=>w.id===id);
  if(t.dataset.step)return completePhase(find(t.dataset.step));
  if(t.dataset.open)openDetail(find(t.dataset.open));
  else if(t.dataset.edit)openPlan(find(t.dataset.edit));
  else if(t.dataset.finish)openRecord(find(t.dataset.finish));
  else if(t.dataset.act==="add")openRecord();
  else if(t.dataset.act==="plan")openPlan();
});
$("btnAdd").onclick=()=>store?openRecord():toast("読み込み中です");
$("btnPlan").onclick=()=>store?openPlan():toast("読み込み中です");
$("btnTheme").onclick=()=>setTheme(isDark()?"light":"dark");
applyTheme();
$("btnSet").onclick=()=>store?openSettings():toast("読み込み中です");
$("sort").onchange=e=>{sortMode=e.target.value;try{localStorage.setItem("un-sort",sortMode)}catch(_){}renderGrid()};
function clearFilter(){filt={q:"",preset:"all",from:"",to:"",tags:[],mode:filt.mode};saveFilt();syncFilterInputs();renderGrid()}
$("fq").addEventListener("input",e=>{filt.q=e.target.value;saveFilt();renderGrid()});
$("fPreset").onchange=e=>{filt.preset=e.target.value;const r=presetRange(filt.preset);if(r){[filt.from,filt.to]=r}else if(filt.preset==="all"){filt.from=filt.to=""}
  saveFilt();syncFilterInputs();renderGrid();if(filt.preset==="custom")$("fFrom").focus()};
["fFrom","fTo"].forEach(id=>$(id).onchange=()=>{filt.from=$("fFrom").value;filt.to=$("fTo").value;filt.preset=(filt.from||filt.to)?"custom":"all";saveFilt();syncFilterInputs();renderGrid()});
$("fMode").onchange=e=>{filt.mode=e.target.value;saveFilt();renderGrid()};
$("fTags").onclick=e=>{const b=e.target.closest("[data-tag]");if(!b)return;const t=b.dataset.tag;filt.tags=filt.tags.includes(t)?filt.tags.filter(x=>x!==t):[...filt.tags,t];saveFilt();renderGrid()};
$("fChips").onclick=e=>{const b=e.target.closest("[data-unf]");if(!b)return;const k=b.dataset.unf;
  if(k==="all")return clearFilter();
  if(k==="q"){filt.q="";$("fq").value=""}else if(k==="date"){filt.from=filt.to="";filt.preset="all"}else if(k.startsWith("tag:")){filt.tags=filt.tags.filter(t=>t!==k.slice(4))}
  saveFilt();syncFilterInputs();renderGrid()};
const openSearch=open=>{$("fq").hidden=!open;$("btnSearch").setAttribute("aria-expanded",open);if(open)$("fq").focus()};
$("btnSearch").onclick=()=>{const open=$("fq").hidden;if(!open&&filt.q){$("fq").focus();return}openSearch(open)};
$("fq").addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();filt.q="";$("fq").value="";saveFilt();renderGrid();openSearch(false);$("btnSearch").focus()}});
$("fq").addEventListener("blur",()=>{if(!filt.q)openSearch(false)});
if(filt.q)openSearch(true),$("fq").blur();
$("btnFilter").onclick=()=>{const f=$("filters");f.hidden=!f.hidden;$("btnFilter").setAttribute("aria-expanded",!f.hidden)};
const applySize=()=>{$("btnSize").setAttribute("aria-pressed",galBig);$("btnSize").setAttribute("aria-label",galBig?"作品を小さく表示":"作品を大きく表示")};
$("btnSize").onclick=()=>{galBig=!galBig;try{localStorage.setItem("un-big",galBig?"1":"0")}catch(e){}applySize();layoutGrid()};
applySize();
// 相対期間（今月など）は開くたびに今日を基準に計算し直す

syncFilterInputs();
/* 表示の切り替え：#gallery でギャラリーを直接開ける */
function route(){const g=location.hash==="#gallery";$("viewHome").hidden=g;$("viewGallery").hidden=!g;$("status").hidden=g;
  $("tabHome").toggleAttribute("aria-current",!g);$("tabGallery").toggleAttribute("aria-current",g);
  if(g)$("tabGallery").setAttribute("aria-current","page");else $("tabHome").setAttribute("aria-current","page")}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);if(location.hash==="#gallery")layoutGrid()});
route();

/* ============ 起動 ============ */
render();
(async()=>{
  let db=null,assets=null;
  if(window.claude&&window.claude.use){
    [db,assets,sampleFn,dlCap]=await Promise.all(["db","assets","sample","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  }
  const attachLocal=async(note)=>{try{store=await localStore();store.watchSettings(v=>{applySettings(v);render()});$("status").innerHTML=`保存先: <b>この端末</b>${note?" ・ "+note:""}<span id="syncStat"></span>`;store.subscribe(l=>{works=l;render()});if(window.driveBoot)window.driveBoot()}
    catch(e){$("status").textContent="保存領域を開けませんでした。プライベートウィンドウでは保存できません。"}};
  if(db){
    store=cloudStore(db,assets);
    store.watchSettings(v=>{applySettings(v);render()});
    const timer=setTimeout(()=>{$("status").textContent="データの読み込みに時間がかかっています…"},10000);
    store.subscribe(list=>{clearTimeout(timer);works=list;$("status").innerHTML=`保存先: <b>クラウド</b>（どの端末から開いても同じ記録） ・ 作品 ${done().length}点 ・ 制作中 ${wip().length}件`;render()},
      err=>{clearTimeout(timer);$("status").textContent="データを読み込めませんでした（"+(err&&err.code||"error")+"）"});
    if(!assets){$("status").textContent+=" ・ 画像アップロードは編集権限のある人のみ"}
  } else {
    await attachLocal("");
  }
  render();
})();
